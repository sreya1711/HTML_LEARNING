<!DOCTYPE html>
<html>
    <head>
        <title>Student Registration Form</title>
    </head>
    <body>
        <h1>Personal Details</h1>
        <label>Full Name: </label>
        <input type="name">
        <label>Email: </label>
        <input type="email">
        <label>Password: </label>
        <input type="pwd">
        <label>Age: </label>
        <input type="number">
        <label>Gender</label>
        <select>
            <option>Female</option>
            <option>Male</option>
            <option>Other</option>
        </select>
        <label>Skills</label>
        <input type="checkbox" name="skill" value="HTML">HTML
        <input type="checkbox" name="skill" value="java">Java
        <input type="checkbox" name="skill" value="sql">SQL
        <Label>Department: </Label>
        <select>
            <option>CSE</option>
            <option>IT</option>
            <option>ECE</option>
            <option>EEE</option>
        </select>
    </body>
</html>
